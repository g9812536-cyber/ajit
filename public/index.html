<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아지트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 로그인 / 회원가입 -->
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="logo">아지트</div>
    <p class="tagline">채팅하고, 음성채널에서 같이 떠들고. 우리끼리 쓰는 공간이에요.</p>
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab" id="tabLogin" role="tab" aria-selected="true">로그인</button>
      <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">회원가입</button>
    </div>

    <form id="loginForm" class="auth-form" autocomplete="on">
      <label class="field-label" for="loginUser">아이디</label>
      <input id="loginUser" class="text-input" autocomplete="username" autocapitalize="none" required>
      <label class="field-label" for="loginPass">비밀번호</label>
      <input id="loginPass" class="text-input" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary-btn">로그인</button>
    </form>

    <form id="registerForm" class="auth-form" autocomplete="off" hidden>
      <label class="field-label" for="regUser">아이디 <span class="hint">영어 소문자·숫자·_ 3~16자, 친구 추가할 때 써요</span></label>
      <input id="regUser" class="text-input" maxlength="16" autocapitalize="none" placeholder="예: michael_07" required>
      <label class="field-label" for="regPass">비밀번호 <span class="hint">6자 이상</span></label>
      <input id="regPass" class="text-input" type="password" autocomplete="new-password" required>
      <label class="field-label" for="regNick">닉네임 <span class="hint">채팅에 보이는 이름</span></label>
      <input id="regNick" class="text-input" maxlength="20" placeholder="예: 마이클" required>
      <span class="field-label" id="regColorLabel">프로필 색</span>
      <div id="regSwatches" class="swatches" role="radiogroup" aria-labelledby="regColorLabel"></div>
      <button type="submit" class="primary-btn">가입하고 입장하기</button>
    </form>
    <p id="authError" class="error" hidden></p>
    <p id="authStatus" class="auth-status">서버에 연결하는 중…</p>
  </div>
</div>

<!-- 앱 -->
<div id="app" class="app" hidden>
  <div class="nav">
    <nav id="rail" class="rail" aria-label="서버"></nav>
    <aside class="sidebar" aria-label="채널">
      <header class="side-head">
        <span id="sideTitle" class="side-title">아지트</span>
        <span id="connDot" class="conn-dot on" title="연결 상태"></span>
        <button id="serverSettingsBtn" class="icon-btn" aria-label="서버 설정" title="서버 설정·초대" hidden></button>
      </header>
      <div id="sideBody" class="side-body"></div>
      <div id="voicePanel" class="voice-panel" hidden>
        <div class="vp-text">
          <div class="vp-status"><span class="pulse"></span>음성 연결됨</div>
          <div class="vp-ch" id="vpChannel"></div>
        </div>
        <button id="leaveVoiceBtn" class="icon-btn danger" aria-label="음성 연결 끊기" title="연결 끊기"></button>
      </div>
      <div class="me-panel">
        <div id="meAvatar" class="avatar md"></div>
        <div class="me-text">
          <div id="meName" class="me-name"></div>
          <div id="meSub" class="me-sub"></div>
        </div>
        <button id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="마이크 끄기" title="마이크 끄기"></button>
        <button id="deafBtn" class="icon-btn" aria-pressed="false" aria-label="소리 끄기" title="소리 끄기"></button>
        <button id="profileBtn" class="icon-btn" aria-label="내 프로필" title="내 프로필"></button>
      </div>
    </aside>
  </div>

  <main class="main">
    <header class="chan-head">
      <button id="menuBtn" class="icon-btn mobile-only" aria-label="메뉴 열기"></button>
      <span id="headMark" class="hash" aria-hidden="true">#</span>
      <h1 id="chanTitle"></h1>
      <button id="membersBtn" class="icon-btn" aria-label="접속자 목록" title="접속자 목록"></button>
    </header>

    <section id="friendsPane" class="friends-pane" hidden>
      <div id="friendTabs" class="tabs" role="tablist"></div>
      <div id="friendsBody" class="friends-body"></div>
    </section>

    <section id="chatPane" class="chat-pane">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="msgInput" rows="1" maxlength="2000" placeholder="메시지 보내기"></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="보내기" disabled></button>
      </form>
    </section>
  </main>

  <aside class="members" aria-label="접속자"><div id="memberBody"></div></aside>
  <div id="scrim" class="scrim"></div>
</div>

<!-- 서버 만들기 / 참가 -->
<div id="serverModal" class="modal-wrap" hidden>
  <div class="modal">
    <h2>서버 만들기</h2>
    <p>친구들과 따로 쓸 공간이에요. 채팅 채널과 음성 채널이 하나씩 같이 만들어져요.</p>
    <form id="createServerForm" class="stack" autocomplete="off">
      <label class="field-label" for="serverNameInput">서버 이름</label>
      <input id="serverNameInput" class="text-input" maxlength="24" placeholder="예: 3반 스터디" required>
      <span class="field-label" id="serverColorLabel">서버 색</span>
      <div id="serverSwatches" class="swatches" role="radiogroup" aria-labelledby="serverColorLabel"></div>
      <button type="submit" class="primary-btn">서버 만들기</button>
    </form>
    <div class="divider"></div>
    <form id="joinServerForm" class="stack" autocomplete="off">
      <label class="field-label" for="joinCodeInput">초대 코드로 참가</label>
      <div class="row">
        <input id="joinCodeInput" class="text-input" maxlength="20" placeholder="친구에게 받은 코드" autocapitalize="none">
        <button type="submit" class="ghost-btn">참가</button>
      </div>
    </form>
    <div class="modal-actions"><button type="button" class="ghost-btn" data-close>닫기</button></div>
  </div>
</div>

<!-- 서버 설정 -->
<div id="settingsModal" class="modal-wrap" hidden>
  <div class="modal">
    <h2 id="settingsTitle">서버 설정</h2>
    <span class="field-label">초대 코드</span>
    <div class="code-box"><code id="inviteCode"></code><button type="button" id="copyCodeBtn" class="ghost-btn">복사</button></div>
    <p class="small">친구가 왼쪽 + 버튼 → "초대 코드로 참가"에 이 코드를 넣으면 들어와요.</p>
    <span class="field-label">친구 바로 초대</span>
    <ul id="inviteList" class="person-list"></ul>
    <div class="divider"></div>
    <div class="modal-actions">
      <button type="button" id="leaveServerBtn" class="ghost-btn danger">서버 나가기</button>
      <button type="button" id="deleteServerBtn" class="ghost-btn danger" hidden>서버 삭제</button>
      <button type="button" class="ghost-btn" data-close>닫기</button>
    </div>
    <p id="confirmText" class="small danger-text" hidden></p>
  </div>
</div>

<!-- 내 프로필 -->
<div id="profileModal" class="modal-wrap" hidden>
  <form id="profileForm" class="modal" autocomplete="off">
    <h2>내 프로필</h2>
    <p id="profileId" class="small"></p>
    <label class="field-label" for="profileNick">닉네임</label>
    <input id="profileNick" class="text-input" maxlength="20" required>
    <span class="field-label" id="profileColorLabel">프로필 색</span>
    <div id="profileSwatches" class="swatches" role="radiogroup" aria-labelledby="profileColorLabel"></div>
    <div class="modal-actions">
      <button type="button" id="logoutBtn" class="ghost-btn danger">로그아웃</button>
      <button type="button" class="ghost-btn" data-close>닫기</button>
      <button type="submit" class="primary-btn compact">저장</button>
    </div>
  </form>
</div>

<div id="audioBin" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
